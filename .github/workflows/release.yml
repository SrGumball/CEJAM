name: "Release & Build"
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CEJAM Hospitalar ${{ github.ref_name }}"
          releaseBody: "Build automatizada do sistema CEJAM."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  deploy-updater:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout updater branch
        uses: actions/checkout@v4
        with:
          ref: updater
          path: updater-branch
          
      - name: Definir Canal
        id: channel
        run: |
          if [[ "${{ github.ref_name }}" == *"beta"* || "${{ github.ref_name }}" == *"rc"* ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi
          
      - name: Download updater JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tenta baixar o latest.json da release recém criada
          gh release download ${{ github.ref_name }} -p "latest.json" --repo ${{ github.repository }} -O latest.json || true
          
          if [ -f latest.json ]; then
            cp latest.json updater-branch/${{ steps.channel.outputs.channel }}.json
            cd updater-branch
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ${{ steps.channel.outputs.channel }}.json
            git commit -m "Update ${{ steps.channel.outputs.channel }}.json for ${{ github.ref_name }}" || true
            git push origin updater
          else
            echo "Nenhum latest.json encontrado para publicar no updater."
          fi
