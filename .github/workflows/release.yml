name: "Release & Build"
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: create admin key from secret
        shell: bash
        run: |
          if [ -z "${{ secrets.FIREBASE_ADMIN_KEY }}" ]; then
            echo "AVISO: FIREBASE_ADMIN_KEY não configurada nos Secrets do GitHub."
            echo "{}" > chave-admin.json
          else
            echo '${{ secrets.FIREBASE_ADMIN_KEY }}' > chave-admin.json
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "CEJAM Hospitalar v__VERSION__"
          releaseBody: "Build automatizada do sistema CEJAM."
          releaseDraft: true
          prerelease: false
