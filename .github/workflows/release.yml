name: "Release & Build"
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: create admin key from secret (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -z "$FIREBASE_KEY_B64" ]; then
            echo "AVISO: FIREBASE_ADMIN_KEY_B64 nao configurada. Usando chave vazia."
            echo "{}" > chave-admin.json
          else
            echo "$FIREBASE_KEY_B64" | base64 -d > chave-admin.json
            echo "chave-admin.json criada com sucesso ($(wc -c < chave-admin.json) bytes)"
          fi
        env:
          FIREBASE_KEY_B64: ${{ secrets.FIREBASE_ADMIN_KEY_B64 }}

      - name: create admin key from secret (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keyB64 = "$env:FIREBASE_KEY_B64"
          if ([string]::IsNullOrEmpty($keyB64)) {
            Write-Host "AVISO: FIREBASE_ADMIN_KEY_B64 nao configurada. Usando chave vazia."
            Set-Content -Path "chave-admin.json" -Value "{}"
          } else {
            $bytes = [System.Convert]::FromBase64String($keyB64)
            [System.IO.File]::WriteAllBytes("chave-admin.json", $bytes)
            Write-Host "chave-admin.json criada com sucesso"
          }
        env:
          FIREBASE_KEY_B64: ${{ secrets.FIREBASE_ADMIN_KEY_B64 }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "CEJAM Hospitalar v__VERSION__"
          releaseBody: "Build automatizada do sistema CEJAM."
          releaseDraft: true
          prerelease: false
